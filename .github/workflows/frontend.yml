name: Frontend CI/CD

env:
  DOCKER_REGISTRY: 168632362689.dkr.ecr.ap-southeast-1.amazonaws.com/uploadit-frontend

on:
  push:
    branches:
      - main
    # paths:
    #   - 'apps/frontend/**'
    #   - 'packages/**'
    #   - 'turbo.json'
    #   - 'Dockerfile.frontend'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm lint --filter frontend...

      - name: Build frontend (CI check)
        run: pnpm turbo run build --filter frontend...

      - name: Set up Docker Buildx 🚀
        if: ${{ github.event.inputs.method != 'deployment' }}
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        if: ${{ github.event.inputs.method != 'deployment' }}
        id: login-ecr
        uses: docker/login-action@v1
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.AWS_ACCESS_KEY_ID }}
          password: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Build and push docker image (prod)
        if: ${{ github.event.inputs.method != 'deployment' }}
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}:latest
            ${{ env.DOCKER_REGISTRY }}:${{ github.sha }}
